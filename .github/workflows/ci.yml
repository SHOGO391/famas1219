name: Security and regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm --prefix app ci --ignore-scripts
      - run: npm run lint
      - run: npm --prefix app run lint
      - run: npm run build
      - run: npm --prefix app test
      - run: npm audit --omit=dev --audit-level=low
      - run: npm --prefix app audit --omit=dev --audit-level=low
